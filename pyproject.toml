[project]
name = "roles-fonciers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maryem26", email = "maryem.zribi@esprit.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "typer>=0.29.1",
]

[project.scripts]
roles-fonciers = "roles_fonciers:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
